# Antigravity A2A configuration — merge into .antigravity/a2a-config.yaml
# Registry paths are relative to agent-skills pack root in workspace.

a2a:
  enabled: true
  protocol_version: "1.0"
  pack_version: "5.0.0"  # sync with VERSION file

  discovery:
    registry: "core/a2a/.well-known/agent-registry.json"
    agent_card_pattern: "core/a2a/registry/{role}.agent-card.json"
    well_known_path: "/.well-known/agent-card.json"

  defaults:
    interaction_mode: stream
    risk_tier: engineering
    timeout_minutes: 120
    authentication_scheme: pack-local

  streaming:
    enabled: true
    event_schema: "contracts/schemas/a2a-task-progress.json"
    sse_content_type: "text/event-stream"

  operations:
    invoke_schema: "contracts/schemas/a2a-jsonrpc-envelope.json"
    task_schema: "contracts/schemas/a2a-task.json"
    artifact_schema: "contracts/schemas/a2a-artifact.json"
    status_schema: "contracts/schemas/a2a-task-status.json"

  coordinator:
    role: agent-coordinator
    plan_schema: "contracts/schemas/coordination-plan.json"

  policies:
    action_boundaries: "core/policies/action-boundaries.yaml"
    data_classification: "core/policies/data-classification.yaml"
    mcp_tool_map: "core/policies/mcp-tool-map.yaml"

  # Map Antigravity capability ids to pack role slugs.
  # Keys are capability identifiers used in agent invocation; values are role slugs.
  # The generated full map is at adapters/antigravity/capability-role-map.generated.yaml
  capability_role_map:
    # Coordination
    coordinate-delivery: agent-coordinator
    discover-agents: agent-discovery-engineer

    # Engineering
    backend-implement: backend-developer
    frontend-implement: frontend-developer
    mobile-implement: mobile-engineer
    cloudflare-deploy: cloudflare-engineer
    devops-deploy: devops-engineer
    graphics-3d: 3d-graphics-engineer

    # Quality & Review
    review-code: reviewer
    run-qa: qa-engineer
    security-audit: security-engineer
    sre-reliability: sre

    # Architecture & Planning
    architect-system: technical-architect
    lead-delivery: technical-lead
    plan-task: task-planner
    manage-project: project-manager
    manage-product: product-manager

    # Analysis & Research
    analyze-business: business-analyst
    analyze-data: data-analyst
    engineer-data: data-engineer
    deep-research: researcher

    # Content & Documentation
    write-article: content-writer
    optimize-seo: seo-analyst
    write-docs: technical-writer
    teach-lesson: teacher

    # Design
    design-ux: ui-ux-designer
