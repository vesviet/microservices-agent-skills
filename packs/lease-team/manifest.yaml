schema_version: "2"

name: lease-team
display_name: Lease Content & SEO Team
description: Content + SEO team pack for the Lease in Vietnam and May Lanh Treo Tuong Astro sites. Composes the global core with the lease-content overlay and the seo-publishing sprint overlay. Enforces the 5-Pillar Strategy (Intelligence, Information, Insights, Neighborhoods, Integration), 2026 GEO/AEO standards (<AnswerFirst> component, fact density, anti-slop gate), 8-batch empirical AEO upgrade discipline, E-E-A-T persona authorship, property cross-linking, AI Overviews citation optimization, and 7-day sprint cadence guardrails.
version: 4.1.0

tags:
  - core
  - content
  - seo
  - geo-aeo
  - content-strategy
  - expat-housing
author: user
maintained_by: platform-team
license: MIT
homepage: https://github.com/vesviet/agent-skills

compatibility:
  min_pack_version: "4.0.0"
  max_pack_version: "5.x"
  requires_schema: "2"

includes:
  - core
  - overlays/lease-content
  - overlays/seo-publishing

capabilities:
  - content-strategy
  - content-generation
  - seo
  - geo-aeo
  - publishing-workflow
  - ai-search-optimization
  - empirical-content-upgrade
  - eeat-persona-authorship
  - property-link-integration

content_focus:
  primary_roles:
    - content-writer
    - seo-analyst
    - task-planner
    - content-manager
  secondary_roles:
    - reviewer
  drafting_skills:
    - write-leaseinvietnam-maylanhtreotuong-data
    - write-article
  audit_skills:
    - optimize-seo
    - audit-content
  standards:
    - "lease-content rules: content-schema, seo-baseline, affiliate-links"
    - "seo-publishing overlay: 7-day boards, GEO/AI visibility tracking"
  workflows:
    - publish-lease-content
    - seo-content-lifecycle
    - content-publishing
    - seo-keyword-brief

corpus:
  snapshot: "2026-09-08"
  leaseinvietnam:
    posts: 463
    properties: 61
    categories: 12
    empirical_batches_completed: 8
    posts_at_masterclass: 80
    answerfirst_coverage: "463/463"
    author_registry_personas: 16
    indexes:
      - leaseinvietnam/plan/CONTENT_INDEX.md
  maylanhtreotuong:
    collections: ["post", "product"]
    indexes: []
    note: regenerate index on next maylanhtreotuong sprint

data_classification: internal

activation:
  strategy: marker_first
  markers:
    - leaseinvietnam/
    - maylanhtreotuong/
    - src/data/apartments/
    - src/data/ac-units/
  glob_patterns:
    - "leaseinvietnam/src/data/**/*.md"
    - "leaseinvietnam/src/data/**/*.mdx"
    - "maylanhtreotuong/src/data/**/*.md"
    - "maylanhtreotuong/src/data/**/*.mdx"

governance:
  eu_ai_act_tier: minimal_risk
  audit_logging: required
  audit_format: otel-json
  retention_days: 90
  secret_handling: env_only
  human_oversight:
    required: true
    gate_actions:
      - publish_to_production
      - modify_secrets
  data_policy: core/policies/data-classification.yaml
  action_policy: core/policies/action-boundaries.yaml
  review_cadence: quarterly
